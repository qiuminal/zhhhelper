# 虎助手 v0.3.2 发布（仓库原生 GitHub Actions）
#
# 用途：构建正式签名 release APK，并创建 GitHub Release v0.3.2。
# 触发：workflow_dispatch 主动触发（按项目约定，发版一律主动 dispatch + 核验，不依赖 cron）。
#
# 说明：
#   - 创建 Release 使用 RELEASE_PAT（本仓库 GITHUB_TOKEN 无法创建 Release，见 PR #4）。
#   - 带防重保护：Release 已存在时直接跳过，避免重复/误发。
#   - 正文为对外精简版；详细记录见仓库 CHANGELOG.md（对内详细版）。

name: Release v0.3.2

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要创建/更新的 Release tag
        type: string
        required: false
        default: v0.3.2

run-name: 发版 ${{ github.event.inputs.release_tag || 'v0.3.2' }}

permissions:
  contents: write

jobs:
  release:
    name: 构建签名 APK 并发布 Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v0.3.2' }}
    steps:
      - name: 检出发布提交
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 从 Secret 还原签名 keystore
        run: |
          printf '%s' '${{ secrets.SIGNING_KEYSTORE_BASE64 }}' | base64 -d > app/signing.jks

      - name: 构建签名 release APK
        env:
          STORE_FILE: signing.jks
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: 验证 APK 签名
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: 校验收到的 versionName
        shell: bash
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print -quit)
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | head -1

      - name: 准备发布附件
        run: cp app/build/outputs/apk/release/app-release.apk zhhhelper-${{ env.RELEASE_TAG }}-release.apk

      - name: 检查 Release 是否已存在
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1; then
            echo "Release ${{ env.RELEASE_TAG }} 已存在，跳过创建。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_TAG }}
          name: 虎助手 ${{ env.RELEASE_TAG }}
          body: |
            0.3.2（2026-09-11）

            · 码表更新

            详细记录见 CHANGELOG.md
          files: zhhhelper-${{ env.RELEASE_TAG }}-release.apk
          fail_on_unmatched_files: true
