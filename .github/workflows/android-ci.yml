name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# 注：曾在此有一个 tag 触发的 release job（softprops/action-gh-release，
# generate_release_notes: true + files: app-release.apk）。它会在每次推送 v* tag 时运行，
# 对已存在的 Release 走「补全」路径：追加自动生成的 What's Changed（含乱码的 PR 标题、
# 重复的 Full Changelog）并加进一个错误命名的 app-release.apk 附件，破坏发版规范。
# 发版一律走「专用 release-vX.Y.Z.yml（workflow_dispatch）+ GitHub API 按规范重建」流程，
# 故彻底移除该 job，避免 tag 推送时二次污染 Release。