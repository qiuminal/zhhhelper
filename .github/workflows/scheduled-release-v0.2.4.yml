# 虎助手 v0.2.4「定时发版」（仓库原生 GitHub Actions）
#
# 计划：2026-09-06 10:00（北京时间）由 GitHub 自动执行：
#   检出 v0.2.4 发布提交 → 构建签名 release APK → 创建 GitHub Release v0.2.4。
# cron 字段为 UTC：'0 2 6 9 *' = 每年 9 月 6 日 02:00 UTC = 10:00 北京时间（Asia/Shanghai）。
# 说明：
#   - schedule 仅对默认分支（main）生效，因此本文件必须先合入 main。
#   - GITHUB_TOKEN 创建的 tag 不会触发其它 workflow，故本任务自包含构建与发版。
#   - 带防重保护：v0.2.4 已存在时直接跳过，避免重复/误发。

name: Scheduled Release v0.2.4

on:
  schedule:
    - cron: '0 2 6 9 *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要创建/更新的 Release tag（仅人工验证时临时覆盖，如 v0.2.4-rc1）
        type: string
        required: false
        default: v0.2.4

run-name: 定时发版 ${{ github.event.inputs.release_tag || 'v0.2.4' }}

permissions:
  contents: write

jobs:
  scheduled-release:
    name: 构建签名 APK 并发布 Release
    runs-on: ubuntu-latest
    env:
      # v0.2.4 正式代码 = main @ 92ef46f，保证发布内容与本地试用验收一致
      RELEASE_SHA: 92ef46f097e78d4ab9dd24c602bf939f0d5f7a52
      RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v0.2.4' }}
    steps:
      - name: 检出发布提交
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 从 Secret 还原签名 keystore
        run: |
          printf '%s' '${{ secrets.SIGNING_KEYSTORE_BASE64 }}' | base64 -d > signing.jks

      - name: 构建签名 release APK
        env:
          STORE_FILE: signing.jks
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: 检查 Release 是否已存在
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1; then
            echo "Release ${{ env.RELEASE_TAG }} 已存在，跳过创建。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 APK 并创建 GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: 虎助手 ${{ env.RELEASE_TAG }}
          body: |
            ## 虎助手 v0.2.4（2026-09-06）

            本次 Release 由 GitHub Actions「定时发版」于 2026-09-06 10:00（北京时间）自动构建并签名，APK 开箱即用，可直接覆盖升级。

            ### 更新内容
            - 启用 R8 代码压缩与资源瘦身，APK 体积减小约 6%
            - 修复「曰」等字首位编码高亮时左侧圆弧被裁切的问题（0.2.3 遗留）
            - 工程与质量：补齐自动化单测与 CI 质量门禁（PR + 状态检查），main 分支只放发布态

            ### 安装
            下载 `app-release.apk` 直接安装即可（与历史版本同一签名，可覆盖升级）。
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true